{% extends 'base.html' %}
{% block content %}
<div class="container-fluid" data-aos="zoom-in">
    <div class="row justify-content-center">
        <div class="col-md-6 mt-5">
            <div class="glass-card p-5 text-center border-danger" style="border-top: 5px solid var(--danger);">
                <i class="bi bi-exclamation-triangle-fill text-danger mb-3" style="font-size: 4rem;"></i>
                <h3 class="fw-bold mb-3">Delete Subject?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete this Subject? This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'subject_list' %}" class="btn btn-light rounded-pill px-5">Cancel</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-5 shadow">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
