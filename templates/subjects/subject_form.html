{% extends 'base.html' %}
{% block content %}
<div class="container-fluid" data-aos="fade-up">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">{% if form.instance.pk %}Edit Subject{% else %}Add Subject{% endif %}</h2>
                <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary rounded-pill px-4"><i class="bi bi-arrow-left me-2"></i> Back</a>
            </div>
            <div class="glass-card p-5">
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    <div class="row g-3 mb-4">
                        {{ form.as_p }}
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold shadow"><i class="bi bi-check-circle me-2"></i> Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
