{% extends 'base.html' %}

{% block content %}
<div class="container-fluid" data-aos="fade-up">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">{% if form.instance.pk %}Edit Student{% else %}Add New Student{% endif %}</h2>
                <a href="{% url 'student_list' %}" class="btn btn-outline-secondary rounded-pill px-4"><i class="bi bi-arrow-left me-2"></i> Back</a>
            </div>

            <div class="glass-card p-5">
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    
                    <h5 class="text-primary mb-4 border-bottom pb-2">Personal Details</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">First Name</label>
                            <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Last Name</label>
                            <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Email Address</label>
                            <input type="email" name="email" value="{{ form.email.value|default:'' }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Phone Number</label>
                            <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Gender</label>
                            <select name="gender" class="form-select rounded-3" required>
                                <option value="Male" {% if form.gender.value == 'Male' %}selected{% endif %}>Male</option>
                                <option value="Female" {% if form.gender.value == 'Female' %}selected{% endif %}>Female</option>
                                <option value="Other" {% if form.gender.value == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Date of Birth</label>
                            <input type="date" name="dob" value="{{ form.dob.value|date:'Y-m-d'|default:'' }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small">Address</label>
                            <textarea name="address" class="form-control rounded-3" rows="3" required>{{ form.address.value|default:'' }}</textarea>
                        </div>
                    </div>

                    <h5 class="text-primary mb-4 border-bottom pb-2">Academic Details</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Enrollment Number</label>
                            <input type="text" name="enrollment_number" value="{{ form.enrollment_number.value|default:'' }}" class="form-control rounded-3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Status</label>
                            <select name="status" class="form-select rounded-3">
                                <option value="Active" {% if form.status.value == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if form.status.value == 'Inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold fs-5 shadow">
                            <i class="bi bi-check-circle me-2"></i> {% if form.instance.pk %}Update Student{% else %}Save Student{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
