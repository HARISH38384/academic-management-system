{% extends 'base.html' %}

{% block content %}
<div class="container-fluid" data-aos="zoom-in">
    <div class="row justify-content-center">
        <div class="col-md-6 mt-5">
            <div class="glass-card p-5 text-center border-danger" style="border-top: 5px solid var(--danger);">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold mb-3">Delete Student?</h3>
                <p class="text-muted mb-4">Are you sure you want to delete the student <strong>{{ student.first_name }} {{ student.last_name }}</strong>? This action cannot be undone and all their data will be lost.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'student_list' %}" class="btn btn-light rounded-pill px-5">Cancel</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-5 shadow">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
