{% extends 'base.html' %}
{% block content %}
<div class="container-fluid" data-aos="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Course Management</h2>
        <a href="{% url 'course_create' %}" class="btn btn-primary rounded-pill px-4 shadow-sm">
            <i class="bi bi-plus me-2"></i> Add Course
        </a>
    </div>
    <div class="glass-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="text-muted">
                    <tr><th>Item</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for item in courses %}
                    <tr>
                        <td class="fw-bold">{{ item }}</td>
                        <td>
                            <a href="{% url 'course_update' item.pk %}" class="btn btn-sm btn-outline-primary rounded-circle me-1"><i class="bi bi-pencil"></i></a>
                            <a href="{% url 'course_delete' item.pk %}" class="btn btn-sm btn-outline-danger rounded-circle"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="2" class="text-center py-5 text-muted">No Data Found</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
